<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Croquis widget demo</title>
    <!--
      Demo page for the Croquis feedback widget.
      1. Build the widget:   pnpm --filter @croquis/widget build
      2. Start the API:      pnpm dev:api   (create a project, note its ingest key)
      3. Fill in data-croquis-ingest-key below and open this file via a local server:
         npx serve examples   (or any static server; file:// also works for the widget UI)
      4. Right-click anything → comment → check the dashboard's Review tab.
    -->
    <style>
      /* Deliberately plain page styles — this simulates a client site. */
      body { font-family: sans-serif; margin: 0; }
      header { padding: 64px 24px; text-align: center; background: #f3f4f6; }
      main { max-width: 640px; margin: 0 auto; padding: 32px 24px; line-height: 1.7; }
      .cta { display: inline-block; padding: 12px 32px; background: #111; color: #fff; border-radius: 999px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Acme Landing Page</h1>
      <p>A pretend client site under review.</p>
      <a class="cta" href="#">Get started</a>
    </header>
    <main>
      <h2>Pricing</h2>
      <p>Simple, honest pricing. Right-click this paragraph to leave a comment on it.</p>
      <h2>FAQ</h2>
      <p>Answers to common questions live here.</p>
    </main>

    <script
      src="../packages/widget/dist/croquis-widget.js"
      data-croquis-api="http://localhost:8787"
      data-croquis-ingest-key="PASTE_YOUR_INGEST_KEY"
      data-croquis-author="Demo Reviewer"
    ></script>
  </body>
</html>
