version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
